name: Deploy

# Builds both images on a GitHub-hosted runner and pushes them to GHCR. The
# VPS runs none of this repo's code: the deploy job sends a tag over SSH, and
# a script that lives on the VPS pulls those images and restarts.
#
# A push to main goes to prod. A run by hand deploys any ref to dev.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to deploy to dev'
        required: true
        default: 'main'

env:
  TARGET: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
  REF: ${{ inputs.ref || github.sha }}

# Never cancel a running deploy.
concurrency: deploy-${{ github.event_name == 'push' && 'prod' || 'dev' }}

permissions:
  contents: read

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Pick the image tag
        id: tag
        run: echo "tag=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: true
          tags: ghcr.io/pgoell/inventory-management-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          push: true
          tags: ghcr.io/pgoell/inventory-management-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to ${{ github.event_name == 'push' && 'prod' || 'dev' }}
    needs: build
    runs-on: ubuntu-latest
    # Holds the SSH key. The key can do one thing on the VPS: hand a tag to
    # the deploy script for this app.
    environment: vps
    steps:
      - name: Send the tag to the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "$TARGET $TAG"
